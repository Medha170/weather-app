apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weather-app
  template:
    metadata:
      labels:
        app: weather-app
    spec:
      containers:
        - name: weather-app
          image: ghcr.io/medha170/weather-app:sha-daa8b4e
          volumeMounts:           
            - mountPath: /app/instance
              name: weather-app-volume
      volumes:
        - name: weather-app-volume
          persistentVolumeClaim:
            claimName: weather-app-claim

