grafana:
  enabled: true
  defaultDashboardsEnabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 512Mi

alertmanager:
  enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    replicas: 1
    retention: 24h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    storageSpec: {}