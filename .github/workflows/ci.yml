name: Weather App CI

on:
  push:
    branches: 
      - ci/cd
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
  
  docker-build:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=ci-cd

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Kubernetes deployment image
        if: github.event_name == 'push'
        env:
          IMAGE_NAME: ghcr.io/Medha170/weather-app
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          NEW_IMAGE="${IMAGE_NAME}:sha-${SHORT_SHA}"

          python -c "from pathlib import Path; import os; p = Path('k8s/deployment.yaml'); lines = p.read_text().splitlines(keepends=True); matches = [i for i, line in enumerate(lines) if 'image: ghcr.io/Medha170/weather-app:' in line]; assert len(matches) == 1, f'Expected exactly one image line, found {len(matches)}'; i = matches[0]; prefix = lines[i].split('image:')[0]; lines[i] = prefix + 'image: ' + os.environ['NEW_IMAGE'] + '\n'; p.write_text(''.join(lines))"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add k8s/deployment.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Update deployment image to sha-${SHORT_SHA} [skip ci]"
            git push
          else
            echo "Deployment image is already up to date."
          fi